# 파이프라인이 멈춘 것을 알린다.
#
# ⚠**이 자리가 비어 있었다**(2026-09-09 발견). 우리 문서 여러 곳이
# 「화면의 신선도 띠가 뜨면 안다」를 안전망으로 적어 왔는데 **거짓이다**:
# `packages/web/src/layout.ts:160` 이 `lagDays` 를 **`builtOn`**(빌드 시각)으로 계산하고
# 이 사이트는 **정적 생성물**이다 — **파이프라인이 멈추면 페이지가 다시 안 구워지므로
# 그 값이 얼어붙는다.** 마지막 빌드 당시가 신선했으면 **영원히 초록**이다.
# ⚠**CLAUDE.md §6 이 2026-08-30 사고에서 같은 함정을 이미 적어 뒀다** — 읽고도 되풀이했다.
#
# ## 이 워크플로가 묻는 것 하나
#
# **「최근 24시간 안에 수집이 한 번이라도 끝까지 돌았는가」.**
# 아니면 **실패로 끝난다 — 그 실패가 곧 알림이다.**
#
# ⚠**수집을 하지 않는다.** npb.jp 요청 **0건**이고 `daily.yml` 을 기동하지도 않는다.
#   콜드 리뷰가 잡았다: 복구 기동을 넣으면 **탐지가 수집을 유발**해 중복 수집이 되살아나고,
#   조회가 완료된 실행만 보므로 **진행 중인 정상 실행 위에 하나 더 얹는다.**
#   → **알린다. 고치는 것은 사람이 한다**(메일을 보고 `daily.yml` 을 수동 실행).
#
# ## ⚠못 잡는 것 (알고 쓴다 · 설계서 §5)
#
#   · **부분 장애** — 세 슬롯 중 하나만 계속 죽어도 다른 것이 성공하면 조용하다
#   · **`deep`(전 시즌 스캔)의 영구 정지** — 그건 한 슬롯에만 걸려 있다
#   · **予告先発 실취득 실패** — `collect` 잡은 수집·보관·대조·시험·배포를 다 하는 잡이라
#     그 성공이 「그날 予告 를 받았다」를 뜻하지 않는다
#   · **지연** — 손대지 않는다(설계서 부록 A)
#   · **탈락** — 막지 못한다. 탐지만 된다
#   · ⚠**이 워크플로 자신의 정지** — **침묵이 「정상」과 「감시기 사망」 양쪽을 뜻한다.**
#     자동으로 못 가른다. 사람이 가끔 `gh run list --workflow heartbeat.yml` 로 본다
#
# ## ✅휴식·오프시즌 소음은 판정을 바꿔서 막았다 (2026-09-11 · 이중 검토 F3 의 후속)
#
#   ~~`scripts/freshness.ts` 에 시즌 종료 예외가 없다 — 오프시즌 약 4개월에 480통~~ 은 해결됐다.
#   옛 규칙(「최신 경기가 2일보다 오래됐다」)은 **휴식마다** `collect` 를 실패시켰다 — 보유 완결 8시즌에 시즌 도중
#   3일 넘게 빈 구간이 **23개**(해마다 10월 CS 전후 두 번 · 6월 교류전 휴식)였고, ⚠**첫 헛경보는 11월이 아니라 10월 초**였다.
#   → 이제 **「NPB 가 치렀다고 표시한 경기를 못 받았다」**로 판정한다. 휴식·오프시즌엔 그 표시가 없으므로 `collect` 가
#     성공하고 이 감시기는 조용하다. 설계: `docs/superpowers/specs/2026-09-11-offseason-collection-verdict-design.md`
#   ⚠**아직 남은 것(단계 B·C · 후속 작업)**: 경기 없는 달·새 시즌 일정 공표 전의 **월간 일정 404** 와
#     **개막 전 공표표 대조 0명** — 그 전까지 **12월(월간 일정이 404 면)~3월에 이 감시기가 울릴 수 있다.**
#     ⚠~~1~3월~~ 이라고 적었다가 고쳤다(3중 검토 2차 N5) — 12월 첫 실행의 모양(공백 행 페이지 / 404)을 아직 안 쟀다.
#   ⚠**실물로 못 잰 전제가 있다** — 확인 날짜(10월 CS 첫 주 · 11월 첫 주 · 12월 첫 실행)는 `docs/operations.md`.
#
# ## ⚠60일 무활동 비활성화가 이 감시기에도 걸린다 (이중 검토 F6)
#
#   `docs/operations.md` 가 무료 감시 후보 3종을 **전부 시한부**라며 탈락시켰고
#   그 표의 한 줄이 정확히 「GitHub Actions 스케줄 · 60일 무활동 시 자동 비활성화」다.
#   ⚠**그 탈락시킨 선택지를 여기서 다시 채택한다.** 판단이 바뀐 이유를 적어 둔다:
#   그때 물음은 **「제품이 낡은 것을 감시할 수 있는가」**였고 답은 「제품 화면이 한다」였다 —
#   **그 답이 거짓이었다는 것이 이번 발견이다.** 시한부라도 **없는 것보다 낫다.**
#   ⚠**대가**: `daily.yml` 이 멈추면 저장소 활동도 멈추고, 60일 뒤 **둘이 함께 비활성화**된다.
#   그 뒤로는 침묵이 「정상」과 구별되지 않는다. **이 워크플로는 아무것도 커밋하지 않는다** —
#   활동을 만드는 것은 `daily.yml` 의 `ops/` 커밋뿐이고, **그것이 멈추는 것이 바로 이 장치가
#   알리려는 상황이다.** 즉 **자기가 감시하는 것에 자기 수명이 걸려 있다.**
#
# ## ✅알림이 실제로 온다 (2026-09-11 · 사용자 수신 확인)
#
# 전체가 **「워크플로가 실패하면 GitHub 이 메일을 보낸다」**에 걸려 있었고, **끝에서 끝까지 확인했다**:
# 스케줄 → 진짜 API 판정 → `stopped` → exit 1 → 잡 실패 → 알림 → **메일 수신.**
# ⚠**알림은 「이 워크플로를 만든 사용자 · cron 을 고쳤다면 그 사용자」에게 간다**(GitHub 문서).
#   지금은 전부 `muji-j` 다. **cron 을 고칠 때는 푸시 전에 `gh auth status` 를 봐라** —
#   개발 중 `gh` 계정이 여러 번 되돌아갔고, 그 상태로 푸시하면 **알림이 조용히 딴 계정으로 옮겨 간다.**
#   ⚠**껐다 켜도 옮겨 간다** — 그 워크플로의 알림이 「다시 켠 사용자」에게 간다(같은 문서 원문 · 2026-09-11 확인).
#   이 워크플로를 끄고 켤 때도 같다. ⚠런북의 기준선 초기화가 끄고 켜는 것은 **`daily.yml`** 이고 그 경고는 그 파일의 `schedule:` 주석에 있다.
# ⚠**다시 확인하는 법**: `main` 이 아닌 브랜치에서 손으로 돌리면 그 브랜치엔 수집 실행이 없어
#   **운영 경보와 같은 경로로 실패한다**(부작용 0 · 절차는 `docs/operations.md`).
#   **거꾸로 말하면 `main` 밖에서 손으로 돌리면 언제나 경보가 난다** — 경보가 왔는데 파이프라인이
#   멀쩡하면 **먼저 그 실행의 브랜치를 보라.**

name: heartbeat

on:
  # ⚠**되돌아보는 창(24시간)과 검사 주기는 다르다.** 실제 탐지 지연은 **둘의 합**이다.
  #   하루 한 번이면 최악 **약 48시간**이 된다(마지막 성공 직후에 멈추면 다음 검사를 통과한다).
  #   6시간 주기면 **최악 30시간**이고, **창이 24시간이라 그 이하로는 못 줄인다.**
  #   ⚠**「30시간」이 이 장치가 약속하는 전부다.** 그보다 빠르다고 적지 마라.
  # ⚠**이 워크플로 자신도 schedule 이라 늦거나 탈락할 수 있다**(그게 이 저장소가 겪는 그 성질이다).
  #   6시간 주기라 한 번 탈락해도 다음이 6시간 뒤다 — 하루 한 번짜리보다 이 점에서 낫다.
  schedule:
    - cron: "0 1,7,13,19 * * *"
  workflow_dispatch:

# ⚠**`permissions:` 를 하나라도 적으면 안 적은 것은 전부 `none` 이 된다**(GitHub 문서 원문:
#   「If you specify the access for any of these permissions, all of those that are not specified
#   are set to `none`」). **그래서 체크아웃에 필요한 `contents: read` 를 반드시 적는다.**
#   ⚠**첫 판에서 이것을 빠뜨렸다**(이중 검토 F2). `actions: read` 만 적어 두고 체크아웃을 했고,
#   설계서에는 「체크아웃 안 한다」고 적혀 있었다 — **설계와 구현이 갈린 채 권한이 옛 전제에 남았다.**
#   이 저장소의 다른 워크플로는 예외 없이 체크아웃 자리에 `contents` 를 적는다
#   (`daily.yml:96` · `access-config.yml:21`). **이 파일만 그 관례를 어겼었다.**
# ⚠**잡 기본 `GITHUB_TOKEN` 을 쓴다 — 새 토큰을 만들지 않는다.**
permissions:
  contents: read
  actions: read

concurrency:
  group: heartbeat
  # ⚠**감시기를 취소하지 마라**(이중 검토 Minor). 취소된 실행은 결론이 `cancelled` 라
  #   **실패 메일이 안 간다** — 경보를 켜려고 만든 장치가 조용히 꺼지는 모양이다.
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # ⚠**요청 수 × 타임아웃이 이 값을 넘으면 판정 대신 잡 타임아웃이 난다**(= 오경보).
    #   최악 21요청 × 10초 = 210초라 10분 안에 넉넉히 들어온다.
    timeout-minutes: 10
    steps:
      # ⚠⚠**평범한 체크아웃이다. sparse-checkout 을 쓰지 마라**(이중 검토 F1 · blocker).
      #   첫 판은 「받는 것이 적을수록 감시기가 덜 깨진다」며 `sparse-checkout: scripts` +
      #   `sparse-checkout-cone-mode: false` 를 썼다. **그 최적화가 바로 깨뜨렸다**:
      #   비-cone 모드는 **루트 파일을 안 가져온다** → `package.json` 이 없다 →
      #   그 안의 `"type": "module"` 이 사라져 Node 가 `.ts` 를 CommonJS 로 읽는다 →
      #   **`SyntaxError: Unexpected token 'export'` 로 매 실행 죽는다.**
      #   ⚠**검토자 둘이 각각 임시 워크트리로 재현했다**(cone 모드로 바꾸면 정상 동작).
      #   ⚠**그러면 이 장치는 「정지를 알린다」가 아니라 「하루 4번 무조건 실패 메일을 보낸다」가 되고,
      #     진짜 정지가 왔을 때 그 메일과 구별되지 않는다** — 막으려던 실패 모드 그 자체다.
      #   **영리함을 빼는 것이 수정이다.**
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      # ⚠**의존성을 설치하지 않는다** — 이 스크립트는 표준 라이브러리와 fetch 만 쓴다.
      #   감시기가 설치 실패로 죽으면 그것이 곧 「거짓 경보」이고, 잦으면 아무도 안 본다.
      # ⚠**`--experimental-strip-types` 를 안 붙인다** — Node 24 에서 불필요하고
      #   `daily.yml` 은 전부 맨 `node scripts/*.ts` 다. **기준이 두 벌이 되면 안 된다.**
      - name: 최근 24시간 안에 수집이 끝까지 돌았는가
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: node scripts/heartbeat.ts
