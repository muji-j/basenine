# 일일 수집.
#
# ⚠**이 워크플로는 60일 무활동이면 자동으로 꺼진다**(GitHub 사양). 완성돼서 잘 도는
# 개인 프로젝트의 정상 상태가 정확히 「60일 무커밋」이므로, **가장 필요한 시점에 스스로 꺼진다.**
# 그래서 매 실행이 수집 요약 1행을 리포에 커밋한다 — 활동이 갱신되어 자동 비활성화를 막는다.
#
# ⚠**주 감시 장치는 이것이 아니다.** 제품 화면의 신선도 표시가 주 감시다
# (조사 결과 무료 외부 감시 3종이 전부 시한부였다). 이 워크플로는 보조다.
#
# ## 보관소를 왜 GitHub 릴리스로 두는가
#
# CI 러너는 매번 빈 상태로 시작하므로 「복원 → 수집 → 보관」이 필요하다.
# 후보는 R2 · Actions 캐시 · 릴리스 자산 셋이었다:
#   · R2          — 계정·API 토큰·시크릿이 늘어난다. 무료 한도는 넉넉하다
#   · Actions 캐시 — **7일 미사용이면 삭제된다.** 소급 불가 자산을 둘 곳이 아니다
#   · 릴리스 자산  — 추가 계정 0 · 추가 시크릿 0(`GITHUB_TOKEN`) · 파일당 2GB
# 아카이브는 **190MB**(5시즌 · 2026-08-18)이고 릴리스 자산 상한은 파일당 2GB라 아직 여유가 크다.
# ⚠시즌을 더 소급하면 시즌당 +40MB 정도씩 는다 — R2로 옮길 시점을 여기서 재라.
#
# ⚠**아카이브는 소급 불가능한 자산이다.** 복원이 조용히 실패한 채 덮어쓰면
# 한 번에 사라지고 로그에는 「정상 종료」가 남는다. `archive-guard`가 **줄어들면 멈춘다.**
#
# ## 왜 액션을 커밋 SHA 로 고정하는가
#
# 이 잡은 `contents: write` 와 **Cloudflare 배포 토큰**을 들고 돈다.
# `@v4` 는 **움직이는 태그**라 상류에서 태그를 옮기면(또는 상류 계정이 뚫리면)
# 우리 승인 없이 새 코드가 그 토큰들과 같은 프로세스에서 돈다 — tj-actions/changed-files 사건이
# 정확히 그 형태였다. 태그명은 뒤에 주석으로 남겨 사람이 읽을 수 있게 한다(2026-08-18 감사 P3).
# ⚠**갱신은 손으로 한다** — `gh api repos/<owner>/<repo>/git/ref/tags/v4 --jq .object.sha`.

name: daily collection

on:
  schedule:
    # ⚠**하루 3회**(2026-08-18 확정). 슬롯마다 **다른 이유**가 있다 — 늘리기 위해 늘린 게 아니다.
    #
    #   07:00 JST (22:00 UTC 전날)  어제 경기 결과의 **보완**. 23:30 이 「아직 안 끝났다」로
    #                              건너뛴 경기(연장·서스펜디드·늦게 끝난 경기)를 여기서 메운다.
    #                              오늘자 予告先発의 1차 확인도 겸한다. (오늘 경기는 안 받는다)
    #   14:00 JST (05:00 UTC)      **내일자 予告先発**. 실측(20시간 · 30분 간격 관측)으로
    #                              페이지가 **13시 무렵** 다음날로 넘어간다. 40분 여유를 둔다.
    #                              오늘자 예고의 변경(등판 변경)도 여기서 잡힌다. (오늘 경기는 안 받는다)
    #   23:30 JST (14:30 UTC)      **당일 경기 결과**. 연장 12회도 대개 끝나 있다.
    #                              내일자 예고를 14:00 에 못 받았으면 여기가 마지막 기회다.
    #
    # ⚠**「23:30 에 오늘 것을 받는다」가 성립하는 이유는 스케줄이 아니라 파서다.**
    #   박스스코어의 `◇試合時間` 으로 종료를 판정해 **끝나지 않은 경기는 저장하지 않는다**(M9).
    #   시각에 기대면 우천 중단 한 번에 잠정값이 확정으로 들어간다.
    # ⚠**그래도 오늘 것은 22시 이후 실행만 받는다** — `update.ts` 가 스스로 판정한다.
    #   M9 때문이 아니라 **M7** 때문이다: 시작 전 경기 페이지에는 타격표가 아예 없어서
    #   파서가 「구조 변경을 의심하라」로 예외를 던진다. 아침·낮에 오늘 것을 받으면
    #   그 예외가 매일 나고 **진짜 구조 변경 경보가 소음에 묻힌다.**
    #   ⚠슬롯을 인자로 알려 주지 않는다 — 크론을 고칠 때 인자를 같이 안 고쳐서 어긋난다.
    # ⚠**GitHub 스케줄은 실측 41~43분 늦게 뜬다**(안 뜬 날도 있었다). 세 슬롯 다 여유가 있다.
    # ⚠**하루 3회 × 실측 9.3분 ≈ 월 840분**. 비공개 리포 무료 한도 2,000분 안이다(§0-12).
    - cron: "0 22 * * *"
    - cron: "0 5 * * *"
    - cron: "30 14 * * *"
    # ── 재시도 슬롯 (각 정시 +1시간) ────────────────────────────────
    # ⚠**직전 실행이 실패했을 때만 돈다.** 성공했으면 아래 `decide` 잡이 10초 만에 끝난다.
    #   무조건 돌리면 수집이 하루 6회가 되어 L1 의 「하루 1회 배치가 기본」에서 더 멀어진다.
    # ⚠**왜 필요한가**: 予告先発은 **거르면 영영 못 받는다**(페이지가 하루치만 게시).
    #   경기 결과는 다음 슬롯이 메우지만 예고는 그 사이에 넘어가 버린다.
    #   08:00 JST · 15:00 JST · 00:30 JST
    - cron: "0 23 * * *"
    - cron: "0 6 * * *"
    - cron: "30 15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # 재시도 판정이 직전 실행의 결론을 읽는다. **읽기만** 한다
  actions: read

concurrency:
  # ⚠중복 기동을 막는다. 수집기는 멱등이지만 동시 실행은 D1 쓰기 예산을 두 배로 태우고,
  # 보관소에 서로를 덮어쓴다.
  group: daily-collection
  cancel-in-progress: false

env:
  # 아카이브·DB를 담아 두는 릴리스. 코드 릴리스가 아니라 **데이터 보관소**다
  DATA_TAG: data-store

jobs:
  # ─────────────────────────────────────────────────────────────────
  # 이 실행을 돌릴 것인가.
  #
  # ⚠**재시도 슬롯은 「직전 실행이 실패했을 때만」 돈다.** 무조건 돌리면 수집이 하루 6회가 되고,
  #   L1 의 「하루 1회 배치가 기본」에서 그만큼 더 멀어진다. 성공한 날에는 이 잡만 돌고 끝난다.
  # ⚠**슬롯을 인자가 아니라 크론 표현식으로 판정한다** — 인자로 넘기면 크론을 고칠 때
  #   인자를 같이 안 고쳐서 조용히 어긋난다.
  # ⚠**모르면 돈다.** API 가 답을 못 주는 날에 수집을 거르는 것보다, 한 번 더 도는 편이 낫다 —
  #   수집기는 멱등이고(M5) 조건부 요청이 붙어 있다(L7).
  # ─────────────────────────────────────────────────────────────────
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: 재시도 슬롯인가 · 직전 실행이 실패했는가
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULE: ${{ github.event.schedule }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          case "${SCHEDULE:-}" in
            "0 23 * * *"|"0 6 * * *"|"30 15 * * *") ;;
            *)
              echo "정시 슬롯(또는 수동) — 그대로 돈다"
              echo "run=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          prev=$(gh api "repos/$REPO/actions/workflows/daily.yml/runs?status=completed&per_page=1" --jq '.workflow_runs[0].conclusion // "unknown"' 2>/dev/null || echo "unknown")
          echo "재시도 슬롯 — 직전 완료 실행의 결론: $prev"
          if [ "$prev" = "success" ]; then
            echo "직전이 성공했다. 이번 재시도는 건너뛴다"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "직전이 성공이 아니다. 재시도한다"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  collect:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: 의존성 설치
        run: npm ci --no-audit --no-fund

      - name: L6 확인 — 리포가 공개면 여기서 멈춘다
        # ⚠**L6(원시 아카이브는 내부 보관)의 유일한 근거가 「이 리포가 비공개다」인데,
        #   그것을 확인하는 코드가 한 줄도 없었다**(2026-08-18 감사 P2).
        #   설정을 한 번 뒤집으면 **154MB 의 npb.jp 원본**이 릴리스 자산째로 공개된다 —
        #   §2-5 의 2층(편집물로서의 DB)·3층(데드카피)에 정면으로 걸리는 상태가 되고,
        #   그걸 알아챌 장치가 없었다. 되돌릴 수 없는 종류의 사고다.
        # ⚠**수집하기 전에 본다** — 올린 뒤에 알면 늦다.
        env:
          GH_TOKEN: ${{ github.token }}
        # ⚠**흔들리는 네트워크 호출을 소급 불가 파이프라인 앞의 하드 게이트로 두면 안 된다.**
        #   처음에 `gh repo view --json visibility`(**GraphQL**)를 재시도 없이 썼다가,
        #   GitHub 장애일 때 **503 한 번에 그날 수집이 통째로 막혔다**(run 32055778604 · 21초 만에 실패).
        #   지키려던 것은 「공개로 뒤집힌 것을 놓치지 않는다」인데, 실제로 일어난 일은
        #   「API 가 흔들려서 오늘 경기를 못 받았다」였다 — 되돌릴 수 없는 쪽이 손해가 크다.
        # ⚠**REST 로 묻는다.** 같은 밤에 GraphQL 이 503 일 때 REST 는 답하고 있었다.
        # ⚠**그래도 「모른다」를 「비공개다」로 읽지 않는다** — 세 번 물어 다 실패하면 멈춘다.
        #   자동으로 통과시키면 이 게이트는 있으나 마나가 된다.
        run: |
          set -euo pipefail
          priv=""
          for i in 1 2 3; do
            if priv=$(gh api repos/${GITHUB_REPOSITORY} --jq .private 2>/dev/null); then break; fi
            echo "공개 범위 조회 ${i}회 실패 — 20초 뒤 재시도"
            sleep 20
            priv=""
          done
          if [ -z "$priv" ]; then
            echo "::error::리포의 공개 범위를 확인하지 못했다(GitHub API 응답 없음). L6 를 확인할 수 없으므로 멈춘다."
            exit 1
          fi
          echo "리포 비공개 여부: ${priv}"
          if [ "$priv" != "true" ]; then
            echo "::error::L6 위반 — 이 리포가 공개다. 원시 아카이브(npb.jp 원본)가 공개된다."
            echo "공개로 전환하려면 먼저 릴리스 자산에서 아카이브를 내리고 CLAUDE.md §2-5 를 다시 판정하라."
            exit 1
          fi

      - name: 아카이브·DB 복원
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data
          if gh release view "$DATA_TAG" >/dev/null 2>&1; then
            # ⚠실패를 삼키지 않는다. 릴리스가 있는데 못 받았다면 그것은 사고다
            gh release download "$DATA_TAG" --dir /tmp/store --clobber
            tar -xf /tmp/store/archive.tar -C data
            # ⚠**덧붙이는 자산도 푼다**(`archive-2021.tar` 같은 것).
            #   소급 시즌은 **로컬에서 백필한 뒤 따로 올린다** — 본 자산(183MB)을 내려받아
            #   합쳐서 다시 올리는 것보다 안전하고 훨씬 싸다. 겹쳐 풀어도 같은 파일이라 문제없다.
            #   ⚠**다음 실행이 알아서 하나로 만든다** — 「보관소에 올림」이 data/archive 를 통째로
            #   다시 tar 하므로, 한 번 돌고 나면 이 자산은 본 자산 안에 들어간다(그때 지워도 된다).
            for extra in /tmp/store/archive-*.tar; do
              [ -e "$extra" ] || continue
              echo "덧붙임 자산 전개: $(basename "$extra")"
              tar -xf "$extra" -C data
            done
            # ⚠**DB 가 없어도 계속 간다**(2026-08-18 감사 P3). DB 는 아카이브에서 **다시 만들 수 있는**
            #   파생물이지만, 아카이브는 소급 불가 자산이다 — 둘을 같은 무게로 다루면 안 된다.
            #   예전에는 `set -e` 아래에서 그냥 풀어서, 자산 2개를 올리는 도중에 잡이 죽어
            #   `bb.sqlite.gz` 만 빠진 릴리스가 남으면 **그 다음부터 매일 여기서 죽었다.**
            #   적재는 아카이브 전체를 다시 훑으므로 DB 는 저절로 복구된다(느릴 뿐이다).
            if [ -f /tmp/store/bb.sqlite.gz ]; then
              gunzip -c /tmp/store/bb.sqlite.gz > data/bb.sqlite
              echo "복원 완료"
            else
              echo "⚠보관소에 bb.sqlite.gz 가 없다 — 아카이브에서 다시 만든다(이번 실행은 느리다)"
            fi
          else
            echo "보관소 릴리스가 없다 — 첫 실행으로 본다"
          fi

      - name: 복원 검증 — 줄어들면 여기서 멈춘다
        run: node scripts/archive-guard.ts check data/archive ops/archive-manifest.json

      - name: 수집·적재
        env:
          BB_ARCHIVER_CONTACT: ${{ secrets.BB_ARCHIVER_CONTACT }}
        # ⚠**쓰기 상한을 여기서만 푼다.** 적재는 아카이브 **전체**를 다시 훑으므로
        # (파서 수정이 옛 행에도 반영되게 하려는 의도) **4시즌이면 37만 행**이 나온다.
        # 기본값 10만은 D1 무료 한도라 **코드의 기본값은 그대로 둔다** — 나중에 D1으로
        # 옮길 때의 안전장치다. 지금 화면은 정적 사이트라 그 한도가 실제 제약이 아니다.
        # ⚠상한에 걸리면 로더는 도중에 멈추고, 매번 앞에서부터 훑으므로 끝에 도달하지 못한다.
        run: node scripts/update.ts --max-writes 5000000

      - name: 수집 후 재검증
        id: guard
        # 수집이 아카이브를 줄이는 일은 없어야 한다. 줄었다면 올리기 전에 멈춘다
        # ⚠**수집이 실패해도 돈다.** 부분 수집분을 지키려면 먼저 검증부터 해야 한다
        if: always()
        run: node scripts/archive-guard.ts check data/archive ops/archive-manifest.json

      - name: 보관소에 올림
        # ⚠**수집이 실패해도 그날 받은 것은 올린다.**
        #   아카이브는 **소급 불가능한 자산**이다 — 오늘 못 받은 경기 페이지는 내일도 못 받는다.
        #   그런데 이 스텝이 앞 스텝의 성공에 매달려 있어서, 선수 페이지 400건 중 1건이
        #   일과성 오류로 실패하기만 해도 **그날 수집한 경기 전부가 버려졌다**(2026-08-17 재검토 P1).
        #   재취득이 매일 300건을 보내게 되면서 그 확률이 무시할 수 없게 됐다.
        # ⚠**단 검증은 통과해야 한다.** 아카이브가 줄어든 상태를 올리면 보관소가 오염된다 —
        #   그때는 올리지 않는 쪽이 맞다. 그래서 `guard` 결과에만 매단다.
        # ⚠**잡 전체는 여전히 실패로 끝난다** — 배포는 `success()` 라 막히고, 사람이 알아챈다.
        if: always() && steps.guard.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tar -cf /tmp/archive.tar -C data archive
          gzip -c data/bb.sqlite > /tmp/bb.sqlite.gz
          gh release view "$DATA_TAG" >/dev/null 2>&1 || \
            gh release create "$DATA_TAG" \
              --title "데이터 보관소" \
              --notes "일일 수집이 덮어쓴다. 코드 릴리스가 아니다." \
              --latest=false
          # ⚠**GitHub 이 503 을 돌려주면 그날 배포가 통째로 날아간다**(2026-08-17 실측).
          #   그날 밤에만 API 503 을 세 번 봤고, 그중 한 번이 **정확히 이 줄**에서 크론을 죽였다
          #   (run 32052853059 · 「보관소에 올림」 실패 → 화면 생성·시험·배포가 전부 skip).
          #   업로드는 **멱등**이다(`--clobber`) — 다시 올려도 같은 결과다. 그러니 다시 시도한다.
          # ⚠`set -e` 아래에서 `A || B` 로 쓰지 않는다 — 어느 실패가 스텝을 죽이는지 셸 규칙에
          #   맡기게 된다. 성공 여부를 변수로 들고 **마지막 줄에서 한 번만** 판정한다
          #   (아래 「기록 갱신과 커밋」의 푸시 재시도와 같은 모양).
          uploaded=0
          for i in 1 2 3 4 5; do
            if gh release upload "$DATA_TAG" /tmp/archive.tar /tmp/bb.sqlite.gz --clobber; then
              uploaded=1; break
            fi
            echo "보관소 업로드 ${i}회 실패 — ${i}0초 뒤 재시도"
            sleep "${i}0"
          done
          [ "$uploaded" = 1 ]

      - name: 기록 갱신과 커밋
        # ⚠이 커밋이 리포 활동을 갱신해 60일 자동 비활성화를 막는다. 자기 문제를 자기가 푼다.
        # ⚠**수집이 실패해도 돈다**(2026-08-18 다방면 감사 P1).
        #   예전에는 앞 스텝이 실패하면 통째로 건너뛰어져서 ⑴ 収集ログ 화면이 그날을
        #   「크론이 안 돈 날」로 그렸고(실제로는 돌았고 부분 성공했다 — 사용자에게 거짓말),
        #   ⑵ archive-manifest 가 실패 연속일수만큼 뒤처져 「줄어들면 멈춘다」 가드의 기준선이 낡았고,
        #   ⑶ 60일 자동 비활성화를 막는 커밋이 안 남았다.
        # ⚠**매니페스트 write 만은 검증 통과에 매단다** — 줄어든 상태를 기준선으로 굳히면 안 된다.
        # ⚠잡 전체는 여전히 실패로 끝난다(배포는 `if: success()` 라 막힌다).
        if: always()
        run: |
          set -euo pipefail
          mkdir -p ops
          # ⚠검증이 통과했을 때만 기준선을 갱신한다 — 줄어든 상태를 정상으로 굳히지 않는다
          if [ "${{ steps.guard.outcome }}" = "success" ]; then
            node scripts/archive-guard.ts write data/archive ops/archive-manifest.json
          else
            echo "⚠아카이브 검증이 통과하지 않아 매니페스트를 갱신하지 않는다"
          fi
          # ⚠**구조화 기록(JSONL)이 화면의 근거다.** 사람이 읽는 산문 로그는 그대로 두되,
          # 화면이 산문을 파싱하게 만들지 않는다 — 문구를 다듬는 순간 조용히 0이 나오는 길이 생긴다.
          # ⚠경기 0건인 날과 크론이 안 돈 날은 DB만으로는 구별되지 않는다. 이 줄이 그 둘을 가른다.
          node scripts/freshness.ts data/bb.sqlite 2 --json ops/collection-log.jsonl \
            >> ops/collection-log.txt 2>&1 || true
          echo "--- $(date -u +%FT%TZ) ---" >> ops/collection-log.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/collection-log.txt ops/collection-log.jsonl ops/archive-manifest.json
          git diff --staged --quiet || git commit -m "chore(ops): collection log"
          # ⚠**푸시 경합이 배포를 막는다.** 뒤의 배포 단계가 `if: success()`라
          # 여기서 실패하면 **화면이 안 올라간 채 「수집 실패」로만 보인다** —
          # 2026-08-16에 실제로 2건 났다(사람이 main 에 머지한 직후 크론이 밀려 들어왔다).
          # 이 커밋은 로그 3파일뿐이라 리베이스로 항상 붙는다. 3회까지 다시 시도한다.
          # ⚠`set -e` 아래에서 `A && exit 1` 류로 쓰지 않는다 — 어느 실패가 스텝을 죽이는지
          # 셸 규칙에 의존하게 된다. 성공 여부를 변수로 들고 **마지막 줄에서 한 번만** 판정한다.
          pushed=0
          for i in 1 2 3; do
            if git push; then pushed=1; break; fi
            echo "푸시 경합 ${i}회 — 리베이스 후 재시도"
            git pull --rebase --no-edit origin "${GITHUB_REF_NAME}" || true
            sleep 5
          done
          [ "$pushed" = 1 ]

      - name: 화면 생성
        env:
          BB_CONTACT: ${{ secrets.BB_CONTACT }}
        # ⚠낡은 데이터면 종료 코드 1이 된다. 그때도 산출물은 남기고, 실패로 표시한다
        # ⚠**시즌 목록의 첫 번째가 「현재」다** — 루트에 놓이고 나머지는 /{연도}/ 아래로 간다.
        # 순서를 바꾸면 기존 URL이 통째로 옮겨간다. 새 시즌이 시작하면 **앞에** 붙인다.
        # ⚠**시즌을 늘리기 전에 보관소에 그 시즌의 아카이브가 있어야 한다.**
        # DB는 매 실행 아카이브 전체를 다시 훑어 만들어지므로, 아카이브에 없는 시즌을
        # 여기 적으면 **그 시즌이 빈 화면으로 생성된다**(2024·2023은 2026-08-17에 올렸다).
        run: node packages/web/tools/build.ts data/bb.sqlite dist 2026,2025,2024,2023,2022,2021,2020,2019,2018

      - name: 시험
        # ⚠**CI 가 `npm test` 를 한 번도 돌리지 않고 있었다**(2026-08-18 감사 P3).
        #   화면 대조 시험(`topbar-consistency`)은 `dist` 를 읽으므로 **생성 뒤**에 와야 한다.
        # ⚠`BB_REQUIRE_DIST=1` 이 핵심이다 — 이것이 없으면 `dist` 가 없을 때 **조용히 skip 되고
        #   종료 코드는 0**이라 「합격」으로 읽힌다(작업규칙 8).
        env:
          BB_REQUIRE_DIST: "1"
        run: npm test

      - name: 배포
        # ⚠**`success()`가 핵심이다.** 신선도가 낡으면 앞의 생성 단계가 종료 코드 1을 낸다.
        # 그때도 배포하면 **낡은 화면이 조용히 올라간다** — 실패는 실패로 끝낸다.
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # ⚠**`npx wrangler@4` 였다** — 매일 최신 4.x 를 받아 `CLOUDFLARE_API_TOKEN` 이 든
        #   환경에서 실행했다(2026-08-18 감사 P2). 이 잡에서 락파일 밖의 코드가 도는 곳은 여기뿐이었다.
        #   지금은 `devDependencies` 에 있고 `npm ci` 가 **락파일의 integrity 로** 설치한다.
        run: npx --no-install wrangler pages deploy dist --project-name bb-app --branch main

      - name: 산출물 보관
        # ⚠**성공한 날에는 올리지 않는다**(2026-08-18 감사 P2). 성공하면 같은 것이 Pages 에 올라가
        #   **볼 수 있는 곳이 이미 있다** — 아티팩트는 그때 아무도 안 본다.
        #   그런데 dist 는 **522MB · 8,611파일**이고 7일 보관이라 매일 그만큼을 태우고 있었다.
        #   원래 의도(「무엇이 만들어졌는데 안 올라갔는가」)는 **실패한 날에만** 필요하다.
        # ⚠`failure()` 만으로는 부족하다 — 취소된 실행도 남긴다. 그래서 `|| cancelled()` 다.
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site
          path: dist
          retention-days: 3
