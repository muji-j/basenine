# 일일 수집.
#
# ⚠**이 워크플로는 60일 무활동이면 자동으로 꺼진다**(GitHub 사양). 완성돼서 잘 도는
# 개인 프로젝트의 정상 상태가 정확히 「60일 무커밋」이므로, **가장 필요한 시점에 스스로 꺼진다.**
# 그래서 매 실행이 수집 요약 1행을 리포에 커밋한다 — 활동이 갱신되어 자동 비활성화를 막는다.
#
# ⚠**주 감시 장치는 이것이 아니다.** 제품 화면의 신선도 표시가 주 감시다
# (조사 결과 무료 외부 감시 3종이 전부 시한부였다). 이 워크플로는 보조다.
#
# ## 보관소를 왜 GitHub 릴리스로 두는가
#
# CI 러너는 매번 빈 상태로 시작하므로 「복원 → 수집 → 보관」이 필요하다.
# 후보는 R2 · Actions 캐시 · 릴리스 자산 셋이었다:
#   · R2          — 계정·API 토큰·시크릿이 늘어난다. 무료 한도는 넉넉하다
#   · Actions 캐시 — **7일 미사용이면 삭제된다.** 소급 불가 자산을 둘 곳이 아니다
#   · 릴리스 자산  — 추가 계정 0 · 추가 시크릿 0(`GITHUB_TOKEN`) · 파일당 2GB
# 지금 아카이브는 27.5MB이므로 릴리스로 충분하다. R2는 용량이 커지면 옮긴다.
#
# ⚠**아카이브는 소급 불가능한 자산이다.** 복원이 조용히 실패한 채 덮어쓰면
# 한 번에 사라지고 로그에는 「정상 종료」가 남는다. `archive-guard`가 **줄어들면 멈춘다.**

name: daily collection

on:
  schedule:
    # 02:00 JST = 17:00 UTC 전날. 어제 경기는 이 시각에 확실히 끝나 있다.
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # ⚠중복 기동을 막는다. 수집기는 멱등이지만 동시 실행은 D1 쓰기 예산을 두 배로 태우고,
  # 보관소에 서로를 덮어쓴다.
  group: daily-collection
  cancel-in-progress: false

env:
  # 아카이브·DB를 담아 두는 릴리스. 코드 릴리스가 아니라 **데이터 보관소**다
  DATA_TAG: data-store

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 의존성 설치
        run: npm ci --no-audit --no-fund

      - name: 아카이브·DB 복원
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data
          if gh release view "$DATA_TAG" >/dev/null 2>&1; then
            # ⚠실패를 삼키지 않는다. 릴리스가 있는데 못 받았다면 그것은 사고다
            gh release download "$DATA_TAG" --dir /tmp/store --clobber
            tar -xf /tmp/store/archive.tar -C data
            gunzip -c /tmp/store/bb.sqlite.gz > data/bb.sqlite
            echo "복원 완료"
          else
            echo "보관소 릴리스가 없다 — 첫 실행으로 본다"
          fi

      - name: 복원 검증 — 줄어들면 여기서 멈춘다
        run: node scripts/archive-guard.ts check data/archive ops/archive-manifest.json

      - name: 수집·적재
        env:
          BB_ARCHIVER_CONTACT: ${{ secrets.BB_ARCHIVER_CONTACT }}
        # ⚠**쓰기 상한을 여기서만 푼다.** 적재는 아카이브 **전체**를 다시 훑으므로
        # (파서 수정이 옛 행에도 반영되게 하려는 의도) 2시즌이면 17만 행이 나온다.
        # 기본값 10만은 D1 무료 한도라 **코드의 기본값은 그대로 둔다** — 나중에 D1으로
        # 옮길 때의 안전장치다. 지금 화면은 정적 사이트라 그 한도가 실제 제약이 아니다.
        # ⚠상한에 걸리면 로더는 도중에 멈추고, 매번 앞에서부터 훑으므로 끝에 도달하지 못한다.
        run: node scripts/update.ts --max-writes 5000000

      - name: 수집 후 재검증
        # 수집이 아카이브를 줄이는 일은 없어야 한다. 줄었다면 올리기 전에 멈춘다
        run: node scripts/archive-guard.ts check data/archive ops/archive-manifest.json

      - name: 보관소에 올림
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tar -cf /tmp/archive.tar -C data archive
          gzip -c data/bb.sqlite > /tmp/bb.sqlite.gz
          gh release view "$DATA_TAG" >/dev/null 2>&1 || \
            gh release create "$DATA_TAG" \
              --title "데이터 보관소" \
              --notes "일일 수집이 덮어쓴다. 코드 릴리스가 아니다." \
              --latest=false
          gh release upload "$DATA_TAG" /tmp/archive.tar /tmp/bb.sqlite.gz --clobber

      - name: 기록 갱신과 커밋
        # ⚠이 커밋이 리포 활동을 갱신해 60일 자동 비활성화를 막는다. 자기 문제를 자기가 푼다.
        run: |
          set -euo pipefail
          mkdir -p ops
          node scripts/archive-guard.ts write data/archive ops/archive-manifest.json
          # ⚠**구조화 기록(JSONL)이 화면의 근거다.** 사람이 읽는 산문 로그는 그대로 두되,
          # 화면이 산문을 파싱하게 만들지 않는다 — 문구를 다듬는 순간 조용히 0이 나오는 길이 생긴다.
          # ⚠경기 0건인 날과 크론이 안 돈 날은 DB만으로는 구별되지 않는다. 이 줄이 그 둘을 가른다.
          node scripts/freshness.ts data/bb.sqlite 2 --json ops/collection-log.jsonl \
            >> ops/collection-log.txt 2>&1 || true
          echo "--- $(date -u +%FT%TZ) ---" >> ops/collection-log.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/collection-log.txt ops/collection-log.jsonl ops/archive-manifest.json
          git diff --staged --quiet || git commit -m "chore(ops): collection log"
          git push

      - name: 화면 생성
        env:
          BB_CONTACT: ${{ secrets.BB_CONTACT }}
        # ⚠낡은 데이터면 종료 코드 1이 된다. 그때도 산출물은 남기고, 실패로 표시한다
        # ⚠**시즌 목록의 첫 번째가 「현재」다** — 루트에 놓이고 나머지는 /{연도}/ 아래로 간다.
        # 순서를 바꾸면 기존 URL이 통째로 옮겨간다. 새 시즌이 시작하면 **앞에** 붙인다.
        run: node packages/web/tools/build.ts data/bb.sqlite dist 2026,2025

      - name: 배포
        # ⚠**`success()`가 핵심이다.** 신선도가 낡으면 앞의 생성 단계가 종료 코드 1을 낸다.
        # 그때도 배포하면 **낡은 화면이 조용히 올라간다** — 실패는 실패로 끝낸다.
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 pages deploy dist --project-name bb-app --branch main

      - name: 산출물 보관
        # ⚠실패했을 때도 남긴다. 「무엇이 만들어졌는데 안 올라갔는가」를 봐야 원인을 안다
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7
