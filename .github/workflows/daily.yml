# 일일 수집.
#
# ⚠**이 워크플로는 60일 무활동이면 자동으로 꺼진다**(GitHub 사양). 완성돼서 잘 도는
# 개인 프로젝트의 정상 상태가 정확히 「60일 무커밋」이므로, **가장 필요한 시점에 스스로 꺼진다.**
# 그래서 매 실행이 수집 요약 1행을 리포에 커밋한다 — 활동이 갱신되어 자동 비활성화를 막는다.
#
# ⚠**주 감시 장치는 이것이 아니다.** 제품 화면의 신선도 표시가 주 감시다
# (조사 결과 무료 외부 감시 3종이 전부 시한부였다). 이 워크플로는 보조다.

name: daily collection

on:
  schedule:
    # 02:00 JST = 17:00 UTC 전날. 어제 경기는 이 시각에 확실히 끝나 있다.
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # ⚠중복 기동을 막는다. 수집기는 멱등이지만 동시 실행은 D1 쓰기 예산을 두 배로 태운다.
  group: daily-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 의존성 설치
        run: npm ci --no-audit --no-fund

      - name: 아카이브·DB 복원
        # 아카이브와 DB는 리포에 두지 않는다(용량·데이터 권리 L6).
        # 실제 운영에서는 R2에서 내려받는 단계가 여기 들어간다.
        run: echo "TODO: R2에서 data/ 복원 — 증분 G(배포)에서 붙인다"

      - name: 수집·적재
        env:
          BB_ARCHIVER_CONTACT: ${{ secrets.BB_ARCHIVER_CONTACT }}
        run: node scripts/update.ts

      - name: 수집 로그 커밋
        # ⚠이 커밋이 리포 활동을 갱신해 60일 자동 비활성화를 막는다. 자기 문제를 자기가 푼다.
        run: |
          mkdir -p ops
          node scripts/freshness.ts data/bb.sqlite 2 >> ops/collection-log.txt 2>&1 || true
          echo "--- $(date -u +%FT%TZ) ---" >> ops/collection-log.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/collection-log.txt
          git diff --staged --quiet || git commit -m "chore(ops): collection log"
          git push
